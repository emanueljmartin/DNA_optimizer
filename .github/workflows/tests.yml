name: Scientific invariants and local design
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
        extras: ['dev,app', 'dev,app,rbs']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-rbs.lock
            requirements-app.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -r requirements-app.lock
      - if: matrix.extras == 'dev,app,rbs'
        run: python -m pip install -r requirements-rbs.lock
      - run: python -m pip install --no-build-isolation -e '.[${{ matrix.extras }}]'
      - run: python -m pytest
      - run: python -m compileall -q src tests
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: python -m pip check
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: bash scripts/setup_app.sh
      - working-directory: frontend
        run: npm exec -- playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run format:check
      - working-directory: frontend
        run: npm test

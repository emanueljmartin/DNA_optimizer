[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-design-platform"
version = "0.1.0"
description = "Local annotated DNA design with independent biological validation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5", "biopython==1.88"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "hypothesis==6.168.5", "ruff==0.16.10", "mypy==1.20.2"]
rbs = ["ostir==1.1.3", "ViennaRNA==2.7.2"]
app = ["fastapi==0.142.4", "uvicorn==0.54.0", "httpx2==2.13.1"]

[project.scripts]
dna-design = "dna_design.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dna_design = ["data/*.json", "web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
untyped_calls_exclude = ["Bio"]

[[tool.mypy.overrides]]
module = ["Bio.*"]
ignore_missing_imports = true
